# =============================================================================
# ZYBRA ROSCA SUBGRAPH SCHEMA
# =============================================================================
# Tracks: User yield, contributions, claimed yield, investments across groups
# Optimized for: Chart data, filtering active/ended groups, individual tracking
# =============================================================================

# =============================================================================
# PROTOCOL LEVEL ENTITIES
# =============================================================================

"""
Protocol-wide statistics and configuration
"""
type Protocol @entity {
  id: ID! # "protocol"
  totalGroups: BigInt!
  activeGroups: BigInt!
  endedGroups: BigInt!
  totalUsers: BigInt!
  totalContributions: BigInt!
  totalYieldClaimed: BigInt!
  totalProtocolFees: BigInt!
  factoryAddress: Bytes!
  createdAt: BigInt!
  updatedAt: BigInt!
}

# =============================================================================
# USER ENTITIES
# =============================================================================

"""
Global User entity - aggregates data across all groups
Query: Get user's overall investment and yield stats
- Excludes ended groups from activeGroupsCount
"""
type User @entity {
  id: ID! # user address (lowercase)
  address: Bytes!

  # Aggregated stats across ALL groups (including ended)
  totalContributed: BigInt!
  totalYieldClaimed: BigInt!
  totalYieldAccrued: BigInt! # claimed + pending (best-effort)
  totalWithdrawn: BigInt!
  totalCapitalWithdrawn: BigInt!

  # Active stats (excludes ended groups)
  activeCapital: BigInt!
  pendingYield: BigInt! # best-effort from on-chain view at event time

  # Group participation
  activeGroupsCount: Int!
  endedGroupsCount: Int!
  totalGroupsJoined: Int!

  # Relationships
  memberships: [Member!]! @derivedFrom(field: "user")
  contributions: [Contribution!]! @derivedFrom(field: "user")
  yieldClaims: [YieldClaim!]! @derivedFrom(field: "user")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "user")
  dailySnapshots: [UserDailySnapshot!]! @derivedFrom(field: "user")

  # Timestamps
  firstSeenAt: BigInt!
  lastActivityAt: BigInt!
}

# =============================================================================
# GROUP ENTITIES
# =============================================================================

"""
ROSCA Group entity - represents a single savings group
Query: Get group info, members, yield stats
- groupEnded = true means group is completed and should be filtered in active queries
"""
type Group @entity {
  id: ID! # group contract address (lowercase)
  address: Bytes!
  admin: Bytes!

  # Configuration
  asset: Bytes! # ERC20 token address
  vault: Bytes! # Morpho vault address
  treasury: Treasury # Treasury entity (set on TreasuryUpdated)
  contributionAmount: BigInt!
  cycleDuration: BigInt!
  totalCycles: BigInt!

  # State - USE THESE FOR FILTERING
  groupStarted: Boolean!
  groupEnded: Boolean! # TRUE = exclude from active group queries
  paused: Boolean!
  startTime: BigInt
  endTime: BigInt
  currentCycle: BigInt!

  # Financial stats
  totalCapitalInGroup: BigInt!
  totalContributions: BigInt!
  totalYieldGenerated: BigInt! # gross yield from on-chain view (best-effort)
  totalYieldClaimed: BigInt!
  totalProtocolFees: BigInt!
  pendingYieldNet: BigInt! # net pending yield (best-effort)
  totalCapitalWithdrawn: BigInt!
  totalYieldWithdrawn: BigInt!

  # Admin transfer
  pendingAdmin: Bytes

  # Member stats
  membersCount: Int!
  activeMembers: Int!

  # Relationships
  members: [Member!]! @derivedFrom(field: "group")
  contributions: [Contribution!]! @derivedFrom(field: "group")
  cycles: [Cycle!]! @derivedFrom(field: "group")
  yieldClaims: [YieldClaim!]! @derivedFrom(field: "group")
  withdrawals: [Withdrawal!]! @derivedFrom(field: "group")
  feeCollections: [FeeCollection!]! @derivedFrom(field: "group")
  dailySnapshots: [GroupDailySnapshot!]! @derivedFrom(field: "group")

  # Timestamps
  createdAt: BigInt!
  updatedAt: BigInt!
}

"""
Member - User's membership in a specific group
Query: Get user's position, yield, and activity in a specific group
- Track individual contribution and yield per group
"""
type Member @entity {
  id: ID! # group_address + "_" + user_address (lowercase)
  user: User!
  group: Group!

  # Capital tracking - INDIVIDUAL PER GROUP
  capitalInGroup: BigInt!

  # Activity tracking
  lastContributedCycle: BigInt!
  contributionsCount: Int!
  totalContributedAmount: BigInt! # Sum of all contributions in this group

  # Yield tracking - INDIVIDUAL PER GROUP
  totalYieldClaimed: BigInt!
  totalYieldAccrued: BigInt! # claimed + pending (best-effort)
  pendingYield: BigInt! # best-effort from on-chain view at event time
  totalCapitalWithdrawn: BigInt!
  totalYieldWithdrawn: BigInt!
  lastYieldClaimAt: BigInt

  # Status
  isActive: Boolean!
  hasWithdrawn: Boolean!
  hasEmergencyWithdrawn: Boolean!
  inEndedGroup: Boolean! # TRUE when group has ended

  # Relationships
  contributions: [Contribution!]! @derivedFrom(field: "member")
  yieldClaims: [YieldClaim!]! @derivedFrom(field: "member")

  # Timestamps
  joinedAt: BigInt!
  leftAt: BigInt
  lastActivityAt: BigInt!
}

# =============================================================================
# TRANSACTION ENTITIES (Individual Tracking)
# =============================================================================

"""
Contribution - Individual contribution transaction
CRITICAL: Each contribution is tracked separately for accurate reporting
"""
type Contribution @entity {
  id: ID! # tx_hash + "_" + log_index
  user: User!
  group: Group!
  member: Member!

  amount: BigInt!
  cycle: BigInt!

  # Running totals at time of contribution
  userTotalContributed: BigInt!
  memberTotalContributed: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

"""
YieldClaim - Yield claimed by a member
CRITICAL: Track each yield claim for accurate yield history
"""
type YieldClaim @entity {
  id: ID! # tx_hash + "_" + log_index
  user: User!
  group: Group!
  member: Member!

  amount: BigInt!

  # Running totals at time of claim
  userTotalYieldClaimed: BigInt!
  memberTotalYieldClaimed: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

"""
Withdrawal - Capital + yield withdrawal
"""
type Withdrawal @entity {
  id: ID! # tx_hash + "_" + log_index
  user: User!
  group: Group!

  capitalAmount: BigInt!
  yieldAmount: BigInt!
  totalAmount: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

# =============================================================================
# CYCLE ENTITIES
# =============================================================================

"""
Cycle - Per-cycle data for a group
Query: Get historical contribution data per cycle
"""
type Cycle @entity {
  id: ID! # group_address + "_" + cycle_number
  group: Group!
  cycleNumber: BigInt!

  # Capital at cycle start
  totalContributions: BigInt!
  contributorsCount: Int!

  # Timestamps
  startTime: BigInt
  endTime: BigInt
}

# =============================================================================
# FEE TRACKING ENTITIES
# =============================================================================

"""
FeeCollection - Protocol fee collection events
"""
type FeeCollection @entity {
  id: ID! # tx_hash + "_" + log_index
  group: Group!
  treasury: Treasury!
  amount: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

# =============================================================================
# CHART DATA ENTITIES - TIME SERIES FOR VISUALIZATION
# =============================================================================

"""
UserDailySnapshot - Daily snapshot of user stats (for charts)
Query: Get historical user yield and investment data for charts
"""
type UserDailySnapshot @entity {
  id: ID! # user_address + "_" + day_timestamp
  user: User!
  dayTimestamp: BigInt!
  dayStartTimestamp: BigInt! # Start of day in seconds

  # Cumulative totals
  totalContributed: BigInt!
  totalYieldClaimed: BigInt!
  totalYieldAccrued: BigInt!
  activeCapital: BigInt!
  pendingYield: BigInt!
  totalWithdrawn: BigInt!

  # Daily deltas (changes that day)
  dailyContributions: BigInt!
  dailyYieldClaimed: BigInt!
  dailyWithdrawals: BigInt!

  activeGroups: Int!
}

"""
GroupDailySnapshot - Daily snapshot of group stats (for charts)
Query: Get historical group yield and TVL data for charts
"""
type GroupDailySnapshot @entity {
  id: ID! # group_address + "_" + day_timestamp
  group: Group!
  dayTimestamp: BigInt!
  dayStartTimestamp: BigInt!

  # Cumulative totals
  totalCapital: BigInt!
  totalYieldGenerated: BigInt!
  totalYieldClaimed: BigInt!
  totalProtocolFees: BigInt!
  pendingYieldNet: BigInt!
  totalCapitalWithdrawn: BigInt!
  totalYieldWithdrawn: BigInt!

  # Daily deltas
  dailyContributions: BigInt!
  dailyYieldClaimed: BigInt!
  dailyWithdrawals: BigInt!
  dailyFeesCollected: BigInt!

  membersCount: Int!
  currentCycle: BigInt!
}

# =============================================================================
# AGGREGATED CHART DATA
# =============================================================================

"""
ProtocolDailySnapshot - Protocol-wide daily stats for dashboard
"""
type ProtocolDailySnapshot @entity {
  id: ID! # "protocol_" + day_timestamp
  dayTimestamp: BigInt!
  dayStartTimestamp: BigInt!

  totalGroups: BigInt!
  activeGroups: BigInt!
  totalUsers: BigInt!

  # Cumulative
  totalContributions: BigInt!
  totalYieldClaimed: BigInt!
  totalProtocolFees: BigInt!

  # Daily
  dailyContributions: BigInt!
  dailyYieldClaimed: BigInt!
  dailyFeesCollected: BigInt!
  dailyNewUsers: BigInt!
  dailyNewGroups: BigInt!
}

# =============================================================================
# EMERGENCY WITHDRAWAL ENTITIES
# =============================================================================

"""
EmergencyWithdrawal - Capital-only emergency withdrawal (yield forfeited)
"""
type EmergencyWithdrawal @entity {
  id: ID! # tx_hash + "_" + log_index
  user: User!
  group: Group!

  capitalAmount: BigInt!
  forfeitedYield: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

# =============================================================================
# ADMIN TRANSFER ENTITIES
# =============================================================================

"""
AdminTransfer - 2-step admin transfer tracking
"""
type AdminTransfer @entity {
  id: ID! # tx_hash + "_" + log_index
  group: Group!
  transferType: String! # "proposed" or "completed"
  fromAdmin: Bytes!
  toAdmin: Bytes!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

# =============================================================================
# TOKEN SWEEP ENTITIES
# =============================================================================

"""
TokenSweep - Recovery of accidentally sent tokens
"""
type TokenSweep @entity {
  id: ID! # tx_hash + "_" + log_index
  group: Group!
  token: Bytes!
  amount: BigInt!

  # Transaction info
  txHash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
  logIndex: BigInt!
}

# =============================================================================
# TREASURY
# =============================================================================

"""
Treasury - Protocol fee receiver
"""
type Treasury @entity {
  id: ID! # treasury address (lowercase)
  address: Bytes!
  totalFeesCollected: BigInt!
  groups: [Group!]! @derivedFrom(field: "treasury")
}
