specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ZybraGroupFactoryV2
    network: sepolia
    source:
      address: "0x7130368fc4Db3c3d9a47Af71dE44b55799ba0b6d"
      abi: ZybraGroupFactoryV2
      startBlock: 10236635
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Group
      abis:
        - name: ZybraGroupFactoryV2
          file: ZybraGroupFactoryV2\abis\ZybraGroupFactoryV2.json
        - name: ZybraGroupV2
          file: ZybraGroupFactoryV2\abis\ZybraGroupV2.json
      eventHandlers:
        - event: GroupDeployed(indexed address,indexed address,indexed
            address,uint256,uint256,uint256,address)
          handler: handleGroupDeployed
      file: ZybraGroupFactoryV2\ZybraGroupFactoryV2.wasm
templates:
  - kind: ethereum
    name: ZybraGroupV2
    network: sepolia
    source:
      abi: ZybraGroupV2
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Group
        - Member
        - Contribution
        - YieldClaim
        - Withdrawal
        - Cycle
        - FeeCollection
        - UserDailySnapshot
        - GroupDailySnapshot
        - Treasury
      abis:
        - name: ZybraGroupV2
          file: ZybraGroupV2\abis\ZybraGroupV2.json
      eventHandlers:
        - event: Joined(indexed address)
          handler: handleJoined
        - event: Left(indexed address)
          handler: handleLeft
        - event: Contributed(indexed address,uint256,uint256)
          handler: handleContributed
        - event: YieldClaimed(indexed address,uint256)
          handler: handleYieldClaimed
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
        - event: GroupStarted(uint256)
          handler: handleGroupStarted
        - event: GroupEnded(uint256)
          handler: handleGroupEnded
        - event: TreasuryUpdated(indexed address,indexed address)
          handler: handleTreasuryUpdated
        - event: FeesCollected(indexed address,uint256)
          handler: handleFeesCollected
        - event: Paused()
          handler: handlePaused
        - event: Unpaused()
          handler: handleUnpaused
      file: templates\ZybraGroupV2\ZybraGroupV2.wasm
