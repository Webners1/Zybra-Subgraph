specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ZybraGroupFactory
    # ========================================
    # UPDATE THESE VALUES FOR YOUR DEPLOYMENT
    # ========================================
    network: sepolia
    source:
      address: "0xe1023cA5cB17033A22d1c455106295658726D49b"
      abi: ZybraGroupFactory
      startBlock: 10282103 # Sepolia deployment block (Feb 18, 2026)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Group
      abis:
        - name: ZybraGroupFactory
          file: ./abis/ZybraGroupFactoryV2.json
        - name: ZybraGroup
          file: ./abis/ZybraGroup.json
      eventHandlers:
        - event: GroupDeployed(indexed address,indexed address,indexed address,uint256,uint256,uint256,address)
          handler: handleGroupDeployed
      file: ./src/factory.ts

templates:
  - kind: ethereum
    name: ZybraGroup
    network: sepolia
    source:
      abi: ZybraGroup
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Group
        - Member
        - Contribution
        - YieldClaim
        - Withdrawal
        - EmergencyWithdrawal
        - Cycle
        - FeeCollection
        - AdminTransfer
        - TokenSweep
        - UserDailySnapshot
        - GroupDailySnapshot
        - Treasury
      abis:
        - name: ZybraGroup
          file: ./abis/ZybraGroup.json
      eventHandlers:
        # Member events
        - event: Joined(indexed address)
          handler: handleJoined
        - event: Left(indexed address)
          handler: handleLeft
        # Contribution events
        - event: Contributed(indexed address,uint256,uint256)
          handler: handleContributed
        # Yield events
        - event: YieldClaimed(indexed address,uint256)
          handler: handleYieldClaimed
        # Withdrawal events
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
        # Emergency withdrawal
        - event: EmergencyWithdrawn(indexed address,uint256,uint256)
          handler: handleEmergencyWithdrawn
        # Group lifecycle events
        - event: GroupStarted(uint256)
          handler: handleGroupStarted
        - event: GroupEnded(uint256)
          handler: handleGroupEnded
        # Treasury / fee events
        - event: TreasuryUpdated(indexed address,indexed address)
          handler: handleTreasuryUpdated
        - event: FeesCollected(indexed address,uint256)
          handler: handleFeesCollected
        # Admin transfer events
        - event: AdminTransferProposed(indexed address,indexed address)
          handler: handleAdminTransferProposed
        - event: AdminTransferred(indexed address,indexed address)
          handler: handleAdminTransferred
        # Token sweep events
        - event: TokenSwept(indexed address,uint256)
          handler: handleTokenSwept
        # Pause events
        - event: Paused()
          handler: handlePaused
        - event: Unpaused()
          handler: handleUnpaused
      file: ./src/group.ts
