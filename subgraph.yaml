specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ZybraGroupFactoryV2
    # ========================================
    # UPDATE THESE VALUES FOR YOUR DEPLOYMENT
    # ========================================
    network: sepolia
    source:
      address: "0xd3AB80D2703ce2A0d17cA73ecF5d6397a3258890"
      abi: ZybraGroupFactoryV2
      startBlock: 10086719 # Approximate Sepolia block - adjust if needed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Group
      abis:
        - name: ZybraGroupFactoryV2
          file: ./abis/ZybraGroupFactoryV2.json
        - name: ZybraGroupV2
          file: ./abis/ZybraGroupV2.json
      eventHandlers:
        - event: GroupDeployed(indexed address,indexed address,indexed address,uint256,uint256,uint256,address)
          handler: handleGroupDeployed
      file: ./src/factory.ts

templates:
  - kind: ethereum
    name: ZybraGroupV2
    network: sepolia
    source:
      abi: ZybraGroupV2
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - User
        - Group
        - Member
        - Contribution
        - YieldClaim
        - Withdrawal
        - Cycle
        - YieldEvent
        - ProtocolFeeCollection
        - UserDailySnapshot
        - GroupDailySnapshot
        - AdminChange
      abis:
        - name: ZybraGroupV2
          file: ./abis/ZybraGroupV2.json
      eventHandlers:
        # Member events
        - event: Joined(indexed address)
          handler: handleJoined
        - event: Left(indexed address,uint256)
          handler: handleLeft
        # Contribution events
        - event: Contributed(indexed address,uint256,uint256)
          handler: handleContributed
        # Yield events
        - event: YieldClaimed(indexed address,uint256)
          handler: handleYieldClaimed
        - event: YieldAccrued(uint256,uint256)
          handler: handleYieldAccrued
        - event: YieldDistributed(uint256,uint256,uint256)
          handler: handleYieldDistributed
        - event: BatchYieldDistributed(uint256[],uint256)
          handler: handleBatchYieldDistributed
        # Withdrawal events
        - event: Withdrawn(indexed address,uint256,uint256)
          handler: handleWithdrawn
          # Note: In contract ABI, the 3rd param is 'yield' but renamed to 'yieldAmount' to avoid reserved keyword
        # Group lifecycle events
        - event: GroupStartedEvent(uint256)
          handler: handleGroupStarted
        - event: GroupEndedEvent(uint256)
          handler: handleGroupEnded
        # Admin events
        - event: AdminChanged(indexed address,indexed address)
          handler: handleAdminChanged
        - event: ProtocolFeeCollected(uint256,uint256)
          handler: handleProtocolFeeCollected
        - event: ProtocolFeeRecipientChanged(indexed address,indexed address)
          handler: handleProtocolFeeRecipientChanged
        # Pause events
        - event: Paused()
          handler: handlePaused
        - event: Unpaused()
          handler: handleUnpaused
      file: ./src/group.ts
